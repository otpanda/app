name: Current main persistent native AppLink qualification
on:
  push:
    branches: [native-current-signed-applink]
permissions:
  contents: read
concurrency:
  group: native-current-signed-applink
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.50.1'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download exact previously qualified signed current-main APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior dist
          gh run download 45740653970 --name current-main-signed-applink-evidence --dir prior
          cp prior/dist/*.apk dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/android-applink-lifecycle.sh dist/otpanda-android-fdroid-native-candidate.apk applink-out
      - name: Require verified association and unforced actual dispatch
        run: |
          grep -q 'CHECK V1_DAL_VERIFIED PASS' applink-out/summary.txt
          grep -q 'CHECK V2_UNFORCED_RESOLVER PASS' applink-out/summary.txt
          grep -q 'CHECK B1_BUTTON_BROWSER_DISPATCH PASS' applink-out/summary.txt
          grep -q 'CHECK B2_CANCEL_RETURN PASS' applink-out/summary.txt
          grep -q 'CHECK I1_RETURN_OPENS_APP PASS' applink-out/summary.txt
          grep -qi 'accounts.google.com' applink-out/browser-render-*.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-main-signed-applink-evidence
          path: |
            dist/*
            applink-out
          retention-days: 7
