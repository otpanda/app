name: Shared app checks and preview
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Refresh public catalog metadata (keep bundled fallback on failure)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tool/refresh_service_catalog.py
      - name: Preserve exact public catalog snapshot and provenance
        uses: actions/upload-artifact@v4
        with:
          name: public-service-catalog
          path: |
            assets/service-catalog.json
            assets/2fa-directory-LICENSE.txt
          retention-days: 30
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/test_service_catalog.py
      - run: node --test test/assignment*.mjs test/session_bootstrap_test.cjs
      - run: flutter analyze
      - name: Check formatting (advisory until a one-time reformat lands after the App53 merge)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - run: flutter build web --base-href /app/ --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-web-preview
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/web
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: development-only-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
  android-release-signing:
    # Exercises the release signing patch with a throwaway key. No secrets are used,
    # so it is safe on pull requests from forks.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - name: Sign a release APK with a throwaway key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype PKCS12 \
            -storepass throwaway-pass -keypass throwaway-pass -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=OTPanda CI throwaway"
          RELEASE_STORE_FILE="$RUNNER_TEMP/throwaway.jks" RELEASE_STORE_PASSWORD=throwaway-pass \
          RELEASE_KEY_ALIAS=throwaway RELEASE_KEY_PASSWORD=throwaway-pass \
            python3 .github/scripts/android-release-signing.py
          flutter build apk --release --target-platform android-arm64
          bash .github/scripts/verify-apk-signature.sh build/app/outputs/flutter-apk/app-release.apk
  deploy-preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web, android-debug]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: app-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fictional-data app preview
        id: deployment
        uses: actions/deploy-pages@v4
