name: Shared app checks and preview
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Refresh public catalog metadata (keep bundled fallback on failure)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tool/refresh_service_catalog.py
      - name: Preserve exact public catalog snapshot and provenance
        uses: actions/upload-artifact@v4
        with:
          name: public-service-catalog
          path: |
            assets/service-catalog.json
            assets/2fa-directory-LICENSE.txt
          retention-days: 30
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/test_service_catalog.py
      - run: node --test test/assignment*.mjs test/session_bootstrap_test.cjs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --base-href /app/ --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-web-preview
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/web
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: development-only-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
  deploy-preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web, android-debug]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: app-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fictional-data app preview
        id: deployment
        uses: actions/deploy-pages@v4
