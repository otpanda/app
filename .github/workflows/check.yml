name: Shared app checks and preview
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Refresh public catalog metadata (keep bundled fallback on failure)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tool/refresh_service_catalog.py
      - name: Preserve exact public catalog snapshot and provenance
        uses: actions/upload-artifact@v4
        with:
          name: public-service-catalog
          path: |
            assets/service-catalog.json
            assets/2fa-directory-LICENSE.txt
          retention-days: 30
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/check_supported_native.py
      - run: python3 tool/test_service_catalog.py
      - run: node --test test/assignment*.mjs test/session_bootstrap_test.cjs test/realtime*.cjs
      - name: Qualify enabled native import root with synthetic channels
        if: github.ref == 'refs/heads/qualification/import-v2-current-sharing-ci'
        run: flutter test --dart-define=TOTP_IMPORT_ENABLED=true test/native/import_current_root_qualification_test.dart
      - name: Node22 for local runtime qualification
        if: github.ref == 'refs/heads/qualification/import-joined-runtime-v2'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Checkout exact public local-runtime qualification fixture
        if: github.ref == 'refs/heads/qualification/import-joined-runtime-v2'
        uses: actions/checkout@v4
        with:
          repository: otpanda/api
          ref: 3730e55cbfb252264a36b1cabd2471b8b2ff6dc4
          path: _qualification_api
          persist-credentials: false
      - name: Qualify joined UI and runtime on SQLite and local workerd storage
        if: github.ref == 'refs/heads/qualification/import-joined-runtime-v2'
        run: |
          cd _qualification_api
          npm ci
          cd ..
          export IMPORT_API_ROOT="$GITHUB_WORKSPACE/_qualification_api"
          sha256sum test/native/import_joined_runtime_qualification_test.dart "$IMPORT_API_ROOT/tool/local-import-joined-stdio.mjs"
          for backend in 0 1; do
            echo "IMPORT_JOINED_BACKEND=$backend (0=SQLite,1=Node API with local workerd D1 storage)"
            export IMPORT_LOCAL_D1="$backend"
            echo 'flutter test --dart-define=TOTP_IMPORT_ENABLED=true --dart-define=IMPORT_JOINED_RUNTIME=true test/native/import_joined_runtime_qualification_test.dart'
            flutter test --dart-define=TOTP_IMPORT_ENABLED=true --dart-define=IMPORT_JOINED_RUNTIME=true test/native/import_joined_runtime_qualification_test.dart
          done
      - run: flutter analyze
      - name: Check formatting (advisory until a one-time reformat lands after the App53 merge)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - run: flutter build web --base-href /app/ --no-wasm-dry-run --dart-define=APP_VERSION=dev-${{ github.sha }}
      - run: python3 tool/check_generated_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-web-preview
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/web
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/check_supported_native.py
      - run: flutter build apk --debug --flavor fdroid --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: development-only-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-fdroid-debug.apk
          retention-days: 7
  android-release-signing:
    # Exercises the release signing patch with a throwaway key. No secrets are used,
    # so it is safe on pull requests from forks.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/check_supported_native.py
      - name: Sign a release APK with a throwaway key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype PKCS12 \
            -storepass throwaway-pass -keypass throwaway-pass -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=OTPanda CI throwaway"
          RELEASE_STORE_FILE="$RUNNER_TEMP/throwaway.jks" RELEASE_STORE_PASSWORD=throwaway-pass \
          RELEASE_KEY_ALIAS=throwaway RELEASE_KEY_PASSWORD=throwaway-pass \
            python3 .github/scripts/android-release-signing.py
          flutter build apk --release --flavor fdroid --target-platform android-arm64
          flutter build apk --release --flavor google --target-platform android-arm64
          python3 tool/android-seed-host/check_release.py build/app/outputs/flutter-apk/app-fdroid-release.apk
          python3 tool/android-seed-host/check_release.py build/app/outputs/flutter-apk/app-google-release.apk
          export THROWAWAY_STORE_PASSWORD=throwaway-pass
          keytool -exportcert -keystore "$RUNNER_TEMP/throwaway.jks" -storepass:env THROWAWAY_STORE_PASSWORD -alias throwaway > "$RUNNER_TEMP/expected-cert.der"
          EXPECTED_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/expected-cert.der" | cut -d ' ' -f1)
          export EXPECTED_CERT_SHA256
          bash .github/scripts/verify-apk-signature.sh build/app/outputs/flutter-apk/app-fdroid-release.apk
          bash .github/scripts/verify-apk-signature.sh build/app/outputs/flutter-apk/app-google-release.apk
  deploy-preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web, android-debug]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: app-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fictional-data app preview
        id: deployment
        uses: actions/deploy-pages@v4
