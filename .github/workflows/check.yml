name: Shared client checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --base-href /client/ --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-web-preview
          path: build/web
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: development-only-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
