name: Shared client checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --base-href /client/ --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-web-preview
          path: build/web
