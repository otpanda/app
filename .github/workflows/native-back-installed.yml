name: Synthetic native Back installed qualification
on:
  push:
    branches: [test/native-back-installed]
permissions:
  contents: read
jobs:
  back:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: flutter build apk --debug --flavor fdroid -t tool/native-back-fixture/main.dart --dart-define=OTPANDA_BATCH_ENABLED=true --dart-define=OTPANDA_BATCH_ENTRY_CAP=3 --dart-define=OTPANDA_BATCH_CODE_BUDGET=100 --dart-define=OTPANDA_BATCH_MIN_PERIOD=20
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/native-back-fixture/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-back-synthetic-proof
          path: back-out
