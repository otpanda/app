name: Release clients
# Runs when a version tag is pushed. It rebuilds every client from the tagged
# commit, publishes them on the GitHub release page, and attaches checksums.
# Tags containing a hyphen (for example v0.0.2-rc.1) become prereleases.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read
concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.50.1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/check_supported_native.py
      - run: python3 tool/test_service_catalog.py
      - run: node --test test/assignment*.mjs test/session_bootstrap_test.cjs test/realtime*.cjs
      - run: flutter analyze
      - run: flutter test
  web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/check_supported_native.py
      - name: Build web app and extension package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          flutter build web --base-href /app/ --no-wasm-dry-run --build-name "${version%%-*}" --build-number "$GITHUB_RUN_NUMBER"
          python3 tool/check_generated_web.py
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/otpanda-web-${GITHUB_REF_NAME}.zip" .)
          flutter build web --csp --no-web-resources-cdn --base-href / --no-wasm-dry-run --build-name "${version%%-*}" --build-number "$GITHUB_RUN_NUMBER"
          python3 tool/check_generated_web.py
          node tool/extension/package.mjs
          (cd build/extension-preview && zip -qr "../../dist/otpanda-extension-${GITHUB_REF_NAME}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/*
          retention-days: 7
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: python3 tool/check_supported_native.py
      - name: Configure persistent release signing
        shell: bash
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "::error::Release signing secret $v is not set."; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
          RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
          RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
          RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
          python3 .github/scripts/android-release-signing.py
      - name: Build, verify signature and name APK
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Android versionName can carry the prerelease suffix, so alphas are identifiable.
          mkdir -p dist
          keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/expected-cert.der"
          EXPECTED_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/expected-cert.der" | cut -d ' ' -f1)
          export EXPECTED_CERT_SHA256
          for flavor in fdroid google; do
            # Preserve upgrade ordering above the dated alpha1-6 candidate codes.
            android_code=$((2026112600 + GITHUB_RUN_NUMBER))
            flutter build apk --release --flavor "$flavor" --build-name "$version" --build-number "$android_code" --dart-define=APP_VERSION="$version"
            apk="build/app/outputs/flutter-apk/app-$flavor-release.apk"
            bash .github/scripts/verify-apk-signature.sh "$apk"
            cp "$apk" "dist/otpanda-android-$flavor-${GITHUB_REF_NAME}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          retention-days: 7
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter --disable-analytics
      - run: python tool/desktop/bootstrap.py
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Windows needs a numeric build-name, so the full version goes in via the define.
          flutter build ${{ matrix.target }} --release --build-name "${version%%-*}" --build-number "$GITHUB_RUN_NUMBER" --dart-define=APP_VERSION="$version"
          mkdir -p dist
          name="otpanda-${{ matrix.target }}-${GITHUB_REF_NAME}"
          case "${{ matrix.target }}" in
            linux) tar -czf "dist/$name-x64.tar.gz" -C build/linux/x64/release/bundle . ;;
            windows) (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/dist/$name-x64.zip" . >/dev/null) ;;
            macos)
              app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
              codesign --force --deep --sign - "$app"
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$name-adhoc-signed.zip" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 7
  android-installed:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: candidate
      - name: Download immutable pinned upgrade fixtures
        run: |
          mkdir -p repair-out original-alpha6 previous-alpha12 previous-alpha13 previous-alpha14 previous-alpha15
          base=https://github.com/otpanda/app/releases/download/qualification-fixtures-2026-11-26
          curl -fLsS "$base/original-alpha6-google.apk" -o original-alpha6/otpanda-android-google-native-candidate.apk
          curl -fLsS "$base/original-alpha6-fdroid.apk" -o original-alpha6/otpanda-android-fdroid-native-candidate.apk
          curl -fLsS "$base/broken-alpha7-google.apk" -o broken-alpha7.apk
          previous=https://github.com/otpanda/app/releases/download/v0.1.0-alpha.12
          curl -fLsS "$previous/otpanda-android-google-v0.1.0-alpha.12.apk" -o previous-alpha12/google.apk
          curl -fLsS "$previous/otpanda-android-fdroid-v0.1.0-alpha.12.apk" -o previous-alpha12/fdroid.apk
          previous=https://github.com/otpanda/app/releases/download/v0.1.0-alpha.13
          curl -fLsS "$previous/otpanda-android-google-v0.1.0-alpha.13.apk" -o previous-alpha13/google.apk
          curl -fLsS "$previous/otpanda-android-fdroid-v0.1.0-alpha.13.apk" -o previous-alpha13/fdroid.apk
          previous=https://github.com/otpanda/app/releases/download/v0.1.0-alpha.14
          curl -fLsS "$previous/otpanda-android-google-v0.1.0-alpha.14.apk" -o previous-alpha14/google.apk
          curl -fLsS "$previous/otpanda-android-fdroid-v0.1.0-alpha.14.apk" -o previous-alpha14/fdroid.apk
          previous=https://github.com/otpanda/app/releases/download/v0.1.0-alpha.15
          curl -fLsS "$previous/otpanda-android-google-v0.1.0-alpha.15.apk" -o previous-alpha15/google.apk
          curl -fLsS "$previous/otpanda-android-fdroid-v0.1.0-alpha.15.apk" -o previous-alpha15/fdroid.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/release-apk-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-release-android-installed-proof
          path: repair-out
  publish:
    needs: [web, android, desktop, android-installed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "OTPanda ${GITHUB_REF_NAME}")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo '::error::Release already exists. Use a new version; assets are immutable.'
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
