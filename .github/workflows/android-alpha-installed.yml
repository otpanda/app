name: Current alpha installed release acceptance
on:
  push:
    branches: [test/native-alpha3-installed]
permissions:
  contents: read
jobs:
  verified-link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          run-id: 45820603562
          github-token: ${{ github.token }}
          path: candidate
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            export PATH="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1):$PATH"
            bash tool/android-applink-lifecycle.sh candidate/otpanda-android-fdroid-native-candidate.apk applink-out
            aapt dump badging candidate/otpanda-android-google-native-candidate.apk > applink-out/google-package.txt
            adb install -r candidate/otpanda-android-google-native-candidate.apk > applink-out/google-install.txt
            adb shell am force-stop app.otpanda
            adb shell am start -W -n app.otpanda/.MainActivity > applink-out/google-launch.txt
            sleep 5
            adb exec-out screencap -p > applink-out/shots/google-current-launch.png
            adb shell uiautomator dump /sdcard/google-current-ui.xml
            adb pull /sdcard/google-current-ui.xml applink-out/google-current-ui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-applink-qualification
          path: applink-out
          retention-days: 7
