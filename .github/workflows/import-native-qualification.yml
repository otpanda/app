name: Disposable import journal and picker qualification
on:
  push:
    branches: [qualification/import-native-current-20261128]
permissions:
  contents: read
jobs:
  import-native:
    if: github.actor == 'abrahammurciano-instinct'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.50.1', channel: stable, cache: true}
      - run: bash tool/bootstrap.sh
      - run: |
          python3 tool/android-import-picker/qualification/uinav_test.py
          python3 tool/android-import-picker/qualification/verify_test.py
      - name: Enable disposable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/android-import-picker/qualification/run.sh import-native-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-native-evidence
          path: import-native-out
          retention-days: 7
