name: Native seed host channel qualification (synthetic)
on:
  workflow_dispatch:
  push:
    branches: [feat/native-seed-host-composition, feat/native-seed-sync-client-adapter, test/native-sealed-seed-channel]
permissions:
  contents: read
jobs:
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: flutter analyze lib test tool/android-seed-host/fixture_main.dart
      - run: flutter test test/offline_totp
      - run: python3 tool/android-seed-host/verify_test.py
      - run: bash tool/offline-totp/release-guard.sh
      - name: Enable KVM on disposable emulator only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/android-seed-host/run.sh seed-host-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-seed-host-channel-evidence
          path: seed-host-out
          retention-days: 7
