name: Released APK in-place upgrade qualification
on:
  push:
    branches: [test/released-apk-upgrade]
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download published APK bytes
        run: |
          mkdir -p upgrade-out apks
          for version in 5 6 7;do
            curl -fLsS "https://github.com/otpanda/app/releases/download/v0.1.0-alpha.$version/otpanda-android-google-v0.1.0-alpha.$version.apk" -o "apks/alpha$version.apk"
          done
          sha256sum apks/* | tee upgrade-out/download-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/upgrade-qualification/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-apk-upgrade-proof
          path: upgrade-out
