name: Delete CI test release
# Maintenance: removes a dummy release and its tag (GitHub's web UI cannot delete a tag).
# Only tags that contain "ci-test" are accepted, so real releases cannot be removed by mistake.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test tag to delete, for example v0.0.0-ci-test.1'
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*-ci-test.[0-9]*) ;;
            *) echo "::error::Refusing to delete '$TAG': not a ci-test tag."; exit 1 ;;
          esac
          gh release delete "$TAG" --cleanup-tag --yes || gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          echo "Deleted $TAG"
