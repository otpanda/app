name: Android emulator smoke
# Boots a hardware-accelerated emulator on a standard GitHub-hosted Linux runner
# (KVM, per GitHub's runner docs), installs the google-flavor debug APK built
# with NATIVE_SIGNIN=true, and checks that it starts and shows the native
# signed-out screen. Not Keystore, passkey, Google, camera or live-API proof.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # verified v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: bash tool/bootstrap.sh
      - run: flutter build apk --debug --flavor google --target-platform android-x64 --dart-define=NATIVE_SIGNIN=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            bash tool/android-emulator-smoke.sh build/app/outputs/flutter-apk/app-google-debug.apk smoke-out
            bash tool/android-os-qualify.sh os-qualify-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: |
            smoke-out
            os-qualify-out
          retention-days: 7
